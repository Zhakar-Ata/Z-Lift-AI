<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Z Lift AI" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Z Lift AI — دستیار هوشمند تکنسین آسانسور</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5e9'/%3E%3Cpath d='M10 8h12l-8 7h8L10 24l4-7h-6z' fill='white'/%3E%3C/svg%3E" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
:root {
  --font: 'Vazirmatn', Tahoma, sans-serif;
  --ai: #0ea5e9; --ai2: #38bdf8; --ai-soft: rgba(14,165,233,.14);
  --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
}
html[data-theme="dark"] {
  --bg: #070d17; --card: #0e1726; --soft: #14203380; --border: #1e2f47;
  --text: #e8f0fa; --text2: #93a8c4; --text3: #5b7290;
}
html[data-theme="light"] {
  --bg: #eef4fa; --card: #ffffff; --soft: #f2f7fc; --border: #d8e4f0;
  --text: #0c1a2b; --text2: #45607e; --text3: #8aa2bd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14.5px; line-height: 1.75; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; color: inherit; }
.hidden { display: none !important; }

/* ===== layout ===== */
.shell { display: flex; flex-direction: column; height: 100dvh; max-width: 760px; margin: 0 auto; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .logo {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--ai), #6366f1);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(14,165,233,.4);
}
.brand strong { font-size: 16px; display: block; line-height: 1.3; }
.brand span { font-size: 11px; color: var(--text3); display: block; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--card); color: var(--text2); display: inline-flex;
  align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-inline-start: 5px; }
.status-dot.off { background: var(--text3); }

/* ===== chat ===== */
.chat { flex: 1; overflow-y: auto; padding: 16px 14px 8px; scroll-behavior: smooth; }
.msg { max-width: 92%; margin-bottom: 12px; animation: pop .2s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } }
.msg.user { margin-inline-start: auto; }
.msg .bubble {
  padding: 11px 15px; border-radius: 16px; font-size: 14px; white-space: pre-wrap; word-break: break-word;
}
.msg.user .bubble { background: var(--ai); color: #fff; border-radius: 16px 4px 16px 16px; }
.msg.ai .bubble { background: var(--card); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; }
.msg .meta { font-size: 10.5px; color: var(--text3); margin-top: 4px; padding: 0 6px; }
.msg.ai .badge-intent {
  display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 9px;
  border-radius: 99px; background: var(--ai-soft); color: var(--ai2); margin-bottom: 6px;
}
.actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.action-chip {
  border: 1.5px solid var(--ai); background: var(--ai-soft); color: var(--ai2);
  border-radius: 12px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  transition: all .15s; text-align: start;
}
.action-chip:active { transform: scale(.97); }
.typing { display: flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ai); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.source-card {
  display: flex; gap: 8px; align-items: flex-start; margin-top: 7px;
  background: var(--soft); border: 1px dashed var(--border); border-radius: 11px;
  padding: 8px 12px; font-size: 11px; color: var(--text2); max-width: 100%;
}
.source-card .sc-sub { color: var(--text3); font-size: 10.5px; }
.copy-link { border: 0; background: none; color: var(--text3); font-size: 10.5px; cursor: pointer; font-family: inherit; padding: 0; }
.copy-link:hover { color: var(--ai2); }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

/* ===== welcome / quick actions ===== */
.welcome { text-align: center; padding: 26px 16px 10px; }
.welcome .big-logo {
  width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 14px;
  background: linear-gradient(135deg, var(--ai), #6366f1);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 34px rgba(14,165,233,.45);
}
.welcome h1 { font-size: 21px; margin-bottom: 4px; }
.welcome p { font-size: 12.5px; color: var(--text2); max-width: 420px; margin: 0 auto 6px; }
.honesty {
  font-size: 11px; color: var(--text3); background: var(--soft); border: 1px dashed var(--border);
  border-radius: 12px; padding: 8px 14px; margin: 10px auto 0; max-width: 460px;
}
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; padding: 14px 4px; }
.quick {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 13px 12px; text-align: start; font-size: 13px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 9px; transition: all .15s;
}
.quick:active { transform: scale(.97); border-color: var(--ai); }
.quick .qi { font-size: 19px; }

/* ===== composer ===== */
.composer {
  display: flex; gap: 9px; padding: 10px 14px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border); background: var(--bg);
}
.composer textarea {
  flex: 1; background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
  padding: 11px 14px; font-size: 15px; resize: none; outline: none; max-height: 110px; line-height: 1.6;
}
.composer textarea:focus { border-color: var(--ai); }
.send-btn {
  width: 46px; height: 46px; border-radius: 14px; border: 0; flex-shrink: 0; align-self: flex-end;
  background: linear-gradient(135deg, var(--ai), #6366f1); color: #fff; font-size: 18px;
  box-shadow: 0 4px 14px rgba(14,165,233,.4);
}
.send-btn:disabled { opacity: .45; box-shadow: none; }

/* ===== mode bar ===== */
.mode-bar { display: flex; gap: 6px; padding: 8px 14px 0; overflow-x: auto; scrollbar-width: none; }
.mode-bar::-webkit-scrollbar { display: none; }
.mode {
  border: 1.5px solid var(--border); background: var(--card); color: var(--text2);
  border-radius: 99px; padding: 5px 13px; font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
}
.mode.active { background: var(--ai); border-color: var(--ai); color: #fff; }

/* ===== drawer (context + settings) ===== */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
.drawer {
  position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(320px, 88vw); z-index: 41;
  background: var(--card); border-inline-end: 1px solid var(--border); padding: 18px;
  padding-top: calc(18px + env(safe-area-inset-top)); overflow-y: auto;
}
.drawer h3 { font-size: 15px; margin-bottom: 12px; }
.drawer .field { margin-bottom: 10px; }
.drawer label { font-size: 11.5px; color: var(--text2); font-weight: 700; display: block; margin-bottom: 4px; }
.drawer input, .drawer select {
  width: 100%; background: var(--soft); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 9px 12px; font-size: 14px; outline: none;
}
.btn {
  border: 0; border-radius: 12px; padding: 11px 18px; font-size: 14px; font-weight: 700;
  background: var(--ai); color: #fff; width: 100%;
}
.btn.ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text2); }
.ctx-pill {
  font-size: 11px; background: var(--ai-soft); color: var(--ai2); border-radius: 99px;
  padding: 3px 11px; font-weight: 700; max-width: 220px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
hr.sep { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" width="24" height="24"><path d="M10 6h12l-8 8h8L10 26l4-8h-6z" fill="#fff"/></svg>
      </div>
      <div style="min-width:0">
        <strong>Z Lift AI <span class="status-dot" id="statusDot"></span></strong>
        <span id="providerLabel">موتور محلی — آفلاین</span>
      </div>
    </div>
    <span class="ctx-pill hidden" id="ctxPill" onclick="openDrawer()"></span>
    <button class="icon-btn" id="ctxBtn" title="زمینه آسانسور" onclick="openDrawer()">🛗</button>
    <button class="icon-btn" id="themeBtn" title="تم">◐</button>
    <button class="icon-btn" id="clearBtn" title="گفتگوی جدید">✚</button>
  </header>

  <div class="mode-bar" id="modeBar"></div>

  <main class="chat" id="chat"></main>

  <footer class="composer">
    <textarea id="input" rows="1" placeholder="سؤال فنی‌ات را بپرس... مثلاً: آسانسور راه نمی‌افته"></textarea>
    <button class="send-btn" id="sendBtn">➤</button>
  </footer>
</div>

<div id="drawerRoot"></div>

<script src="brain.js"></script>
<script src="standards.js"></script>
<script src="engine.js"></script>
<script src="knowledge.js"></script>
<script src="arena.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
